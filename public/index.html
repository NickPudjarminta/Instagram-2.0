<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Instagram 2.0 — News Feed</title>
  <meta name="description" content="Follow tech, AI, gaming and science news in a photo feed." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/app.css" />
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <a class="logo" href="#/"><span class="logo-mark">I</span><span class="logo-word">Instagram 2.0</span></a>
      <a class="nav-item" href="#/" data-nav="home"><i data-icon="home"></i><span>Home</span></a>
      <a class="nav-item" href="#/explore" data-nav="explore"><i data-icon="search"></i><span>Explore</span></a>
      <a class="nav-item" href="#/following" data-nav="following"><i data-icon="plus"></i><span>Follow feeds</span></a>
      <a class="nav-item" href="#/saved" data-nav="saved"><i data-icon="bookmark"></i><span>Saved</span></a>
      <button class="nav-item nav-theme" type="button" id="themeToggle"><i data-icon="moon"></i><span>Theme</span></button>
    </nav>

    <header class="topbar">
      <a class="logo" href="#/"><span class="logo-word">Instagram 2.0</span></a>
      <div class="topbar-actions">
        <a href="#/following" class="icon-btn" aria-label="Follow feeds"><i data-icon="plus"></i></a>
        <a href="#/saved" class="icon-btn" aria-label="Saved"><i data-icon="bookmark"></i></a>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <aside class="rail" id="rail" aria-label="Suggestions"></aside>

    <nav class="tabbar" aria-label="Tabs">
      <a href="#/" data-nav="home" aria-label="Home"><i data-icon="home"></i></a>
      <a href="#/explore" data-nav="explore" aria-label="Explore"><i data-icon="search"></i></a>
      <a href="#/following" data-nav="following" aria-label="Follow feeds"><i data-icon="plus"></i></a>
      <a href="#/saved" data-nav="saved" aria-label="Saved"><i data-icon="bookmark"></i></a>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
